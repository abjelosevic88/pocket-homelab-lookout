# Pocket Lookout — watch web pages for changes (Go + SQLite). One container, one volume,
# plus an optional headless browser for pages that need JavaScript (and page pictures).
services:
  pocket-lookout:
    image: ghcr.io/abjelosevic88/pocket-homelab-lookout:latest
    container_name: pocket-lookout
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Pushes (Apprise / ntfy / JSON webhook); everyone can set their own under Settings → Notifications.
      NOTIFY_URL: ${NOTIFY_URL:-}
      # The headless browser below; leave empty to read pages without JavaScript only.
      BROWSER_URL: ws://browser:3000
      # Pocket Core: one sign-in, Pocket AI and events for the other Pocket apps.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - browser

  # A Chrome that opens each page in a fresh profile (any Chrome DevTools
  # endpoint works: browserless, or chrome --remote-debugging-port → http://chrome:9222).
  browser:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: pocket-lookout-browser
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      MAX_CONCURRENT_CHROME_PROCESSES: "4"
